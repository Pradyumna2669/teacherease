<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16243b" />
    <meta name="robots" content="noindex, nofollow" />
    <title>You're offline · TeacherEase</title>
    <!-- Static, not a Next route: the service worker precaches literal paths, so
         a page built by Next would come back without its stylesheet and render
         as black Times New Roman. Everything this page needs is inline. -->
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        background-color: #fcfcf9;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #5a6675;
        line-height: 1.6;
        -webkit-user-select: none;
        user-select: none;
      }
      .card { max-width: 24rem; text-align: center; }
      .mark { display: block; margin: 0 auto; }
      h1 {
        margin: 24px 0 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #16243b;
      }
      p { margin: 12px 0 0; }
      .quiet { margin-top: 16px; font-size: 0.875rem; }
      button {
        margin-top: 24px;
        width: 100%;
        min-height: 48px;
        padding: 12px 16px;
        border: 0;
        border-radius: 8px;
        background: #e0392b;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:active { background: #16243b; }
    </style>
  </head>
  <body>
    <div class="card">
      <svg class="mark" width="56" height="56" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#16243b" />
        <rect x="7.5" y="5" width="17" height="22" rx="2.5" fill="#faf6ef" />
        <rect x="11" y="5" width="1.1" height="22" fill="#e0392b" opacity="0.5" />
        <text
          x="17.2"
          y="16.4"
          dominant-baseline="central"
          text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="17"
          font-weight="700"
          fill="#16243b"
        >P</text>
      </svg>
      <h1>No internet connection</h1>
      <p>
        TeacherEase needs a connection to open your saved papers and to read a
        scanned one. Your work is saved on our side — nothing is lost.
      </p>
      <p class="quiet">Reconnect and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
